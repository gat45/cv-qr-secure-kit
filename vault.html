<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Documents sécurisés</title><link rel="stylesheet" href="style.css"></head><body><main class="vault-page"><section class="vault-card"><p class="eyebrow">Accès sécurisé</p><h1>Documents administratifs</h1><p>Ces documents sont chiffrés. Saisissez le code communiqué par le candidat.</p><form id="form"><label for="password">Code d’accès</label><input id="password" type="password" required><button class="button primary">Ouvrir les documents</button></form><p id="status"></p><div id="list" class="document-list" hidden></div><a class="back-link" href="index.html">← Retour au CV</a></section></main><script>const i=310000,s=document.querySelector('#status'),l=document.querySelector('#list');async function d(b,p){let x=new Uint8Array(b),k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:x.slice(0,16),iterations:i,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['decrypt']);return crypto.subtle.decrypt({name:'AES-GCM',iv:x.slice(16,28),tagLength:128},k,x.slice(28))}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let p=password.value;try{let r=await fetch('vault/manifest.enc'),m=JSON.parse(new TextDecoder().decode(await d(await r.arrayBuffer(),p)));l.replaceChildren();m.documents.forEach(o=>{let b=document.createElement('button');b.className='document-button';b.textContent='Ouvrir : '+o.label;b.onclick=async()=>{let r=await fetch('vault/'+o.file),u=URL.createObjectURL(new Blob([await d(await r.arrayBuffer(),p)],{type:o.type}));window.open(u,'_blank','noopener')};l.append(b)});l.hidden=false;s.textContent='Accès accordé.'}catch{s.textContent='Code incorrect ou documents indisponibles.'}};</script></body></html>
